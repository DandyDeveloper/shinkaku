# docker-compose.prod.yml — production stack
#
# Builds optimised images: distroless Go binary + nginx serving static assets.
# The frontend nginx container proxies /api, /auth, and /health to the backend.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
# On first run, the ollama-init service automatically pulls OLLAMA_MODEL.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    environment:
      DB_PATH: /data/shinkaku.db
      OLLAMA_URL: http://ollama:11434
      # Keep Go's heap target below the container limit.
      GOMEMLIMIT: ${BACKEND_GO_MEMORY_LIMIT:-768MiB}
    volumes:
      - backend-data:/data
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Uses the 'production' stage — nginx serving pre-built static files
      target: production
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Not exposed externally in production — only reachable by backend
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    # For AMD GPU passthrough, add the AMD override file documented in README.md.
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ollama:
        condition: service_healthy
    command: ["sh", "-c", "ollama pull \"$OLLAMA_MODEL\""]
    restart: "no"

volumes:
  backend-data:
  ollama-data:
